  grp.slice(i+1).split('!').forEach(ent=>{const j=ent.indexOf(':');const name=ent.slice(0,j);
    ent.slice(j+1).split(';').forEach(s=>{const v=s.split(',').map(Number);let x=v[0],y=v[1];const pts=[[y/1e3,x/1e3]];
      for(let k=2;k<v.length;k+=2){x+=v[k];y+=v[k+1];pts.push([y/1e3,x/1e3]);}
      const ln=L.polyline(pts,isCanal?{color:'#6E6A64',weight:2.5,opacity:.9,pane:'extra'}:{color:'#7FB2EC',weight:1.6,opacity:.85,pane:'extra'});
      ln.bindTooltip(isCanal?name:name+' ('+key+' system)',{sticky:true});
      ln.addTo(isCanal?canalLayer:tribLayer);
      if(!isCanal&&groups[key])groups[key].addLayer(L.polyline(pts,{opacity:0,weight:0,interactive:false}));
    });
  });
});

const STORIES={"all": {"html": "<p class=\"kicker\">Overview · eight British estuaries<\/p>\n<h2>Where the sea meets the rivers<\/h2>\n<p class=\"lead\">Twice a day the sea flows up Britain's rivers, sometimes for more than 100 km. Where it meets fresh water lies one of the most productive, most used and most threatened landscapes in the country: the estuary.<\/p>\n<div class=\"facts\">\n<div><b>163<\/b><span>estuaries in the UK<sup><a href=\"#s-a1\">1<\/a><\/sup><\/span><\/div>\n<div><b>~⅓<\/b><span>of Western Europe's estuarine habitat<sup><a href=\"#s-a1\">1<\/a><\/sup><\/span><\/div>\n<div><b>~16.5 cm<\/b><span>UK sea-level rise since 1900<sup><a href=\"#s-a9\">9<\/a><\/sup><\/span><\/div>\n<div><b>5.2 Mt<\/b><span>organic carbon stored in Britain's saltmarshes<sup><a href=\"#s-a6\">6<\/a><\/sup><\/span><\/div>\n<\/div>\n<h3>How a tidal river works<\/h3>\n<p>An estuary is a partly enclosed stretch of coast where seawater mixes with fresh water from rivers.<sup><a href=\"#s-a1\">1<\/a><\/sup> The <i>tidal limit<\/i> is the furthest point upstream that the tide reaches; it is often fixed by a weir or lock, such as Teddington on the Thames or Howley Weir on the Mersey. The tide travels much further than the salt. Seawater is denser than river water, so salt pushes upstream along the bottom while fresh water flows out over the top, and the mixing zone shifts with the seasons. High river flow pushes the salt seaward; in a dry summer it creeps inland.<sup><a href=\"#s-a2\">2<\/a><\/sup><\/p>\n<p>Scientists divide the gradient by salinity, in parts per thousand: fresh water below 0.5, then oligohaline (0.5–5), mesohaline (5–18), polyhaline (18–30) and full seawater above about 30.<sup><a href=\"#s-a3\">3<\/a><\/sup> On this map, \"brackish\" covers the middle of that range. Where fresh and salt water meet, fine sediment is trapped and concentrated into a turbidity maximum, which is why so many British estuaries are brown with mud.<sup><a href=\"#s-a4\">4<\/a><\/sup><\/p>\n<p>Shape matters. In a long, funnel-shaped estuary the incoming tide is squeezed into ever narrower and shallower water, so its range grows inland. That is why the Severn, with a range of up to about 14 m, has the second-highest tides in the world, and why it, the Mersey and the Trent can produce tidal bores, waves that run upstream on the flood tide.<sup><a href=\"#s-a5\">5<\/a><\/sup><\/p>\n<h3>Why estuaries matter for nature<\/h3>\n<p>Almost half of Britain's coastline lies within estuaries, and the UK holds about a third of the estuarine habitat of Western Europe.<sup><a href=\"#s-a1\">1<\/a><\/sup> Their mudflats are among the most productive habitats on Earth, packed with worms, snails and shellfish. Each winter they feed internationally important numbers of waders and wildfowl from the Arctic; the Thames, Humber, Mersey, Severn and Forth each average tens of thousands of waterbirds.<sup><a href=\"#s-a7\">7<\/a><\/sup> Estuaries are nursery grounds for fish such as sea bass, and the only route between sea and river for salmon, sea trout, eel, lamprey, shad and smelt.<sup><a href=\"#s-a8\">8<\/a><\/sup> Saltmarshes also store carbon: Britain's marshes hold about 5.2 million tonnes of organic carbon, mostly in their soils.<sup><a href=\"#s-a6\">6<\/a><\/sup><\/p>\n<p>Many of these species are in trouble. The European eel is critically endangered, with glass-eel recruitment a tiny fraction of what it was in the 1970s, and England's salmon stocks are at their lowest on record.<sup><a href=\"#s-a8\">8<\/a><\/sup> Sparling, or smelt, now survives in Scotland only in the Cree, the Forth and the Tay.<sup><a href=\"#s-a8\">8<\/a><\/sup><\/p>\n<h3>Why estuaries matter for people<\/h3>\n<p>Britain's great cities and ports grew on tidal rivers: London, Liverpool, Hull, Newcastle, Glasgow, Edinburgh, Bristol and Dundee. In the industrial age the same rivers became drains. By the mid-20th century the tidal Thames, Mersey, Tyne and Clyde were so short of oxygen that fish could not pass. Their recovery, driven by sewage treatment and the decline of heavy industry, is one of the great environmental success stories of the past fifty years, although storm overflows still spill untreated sewage hundreds of thousands of times a year in England.<sup><a href=\"#s-a10\">10<\/a><\/sup><\/p>\n<h3>A rising sea<\/h3>\n<p>Sea level around the UK has risen about 16.5 cm since 1900, and the rate has roughly doubled in recent decades.<sup><a href=\"#s-a9\">9<\/a><\/sup> By 2100 it could rise by around half a metre to more than a metre at London, depending on global emissions.<sup><a href=\"#s-a11\">11<\/a><\/sup> Where seawalls are fixed, mudflats and saltmarsh are squeezed out between rising water and hard defences. Increasingly, the answer is to give space back: at sites such as Alkborough on the Humber and Steart on the Severn, embankments have been breached to let the tide create new marsh that absorbs floods and feeds birds.<sup><a href=\"#s-a12\">12<\/a><\/sup><\/p>\n<h3>Eight rivers, eight characters<\/h3>\n<div class=\"rivers\">\n<a href=\"#\" data-go=\"Thames\"><b>Thames<\/b><br>A capital's tidal river, from biologically dead to over 115 fish species.<\/a>\n<a href=\"#\" data-go=\"Severn\"><b>Severn<\/b><br>A 14 m tidal range, the Severn bore and the return of the shad.<\/a>\n<a href=\"#\" data-go=\"Mersey\"><b>Mersey<\/b><br>From Britain's most polluted estuary to salmon at Warrington.<\/a>\n<a href=\"#\" data-go=\"Humber\"><b>Humber<\/b><br>A fifth of England drains through one muddy funnel.<\/a>\n<a href=\"#\" data-go=\"Tyne\"><b>Tyne<\/b><br>From coal and shipyards to England's top salmon river.<\/a>\n<a href=\"#\" data-go=\"Clyde\"><b>Clyde<\/b><br>Shipbuilding river, a sharp line between fresh and salt at Glasgow.<\/a>\n<a href=\"#\" data-go=\"Forth\"><b>Forth<\/b><br>A long firth of mudflats, bridges and Scotland's last sparling.<\/a>\n<a href=\"#\" data-go=\"Tay\"><b>Tay<\/b><br>The UK's mightiest river by flow, fresh almost to the sea.<\/a>\n<\/div>\n<div class=\"src\"><b>Sources<\/b><ol>\n<li id=\"s-a1\"><a href=\"https://data.jncc.gov.uk/data/69ebf0da-dc7e-47b2-afcc-440624768395/jncc-inventory-uk-estuaries-1-1997.pdf\" target=\"_blank\" rel=\"noopener\">JNCC – Inventory of UK estuaries<\/a>; <a href=\"https://www.britishwildlife.com/?p=9721\" target=\"_blank\" rel=\"noopener\">British Wildlife – Estuaries<\/a><\/li>\n<li id=\"s-a2\"><a href=\"https://coastalwiki.org/wiki/Estuarine_circulation\" target=\"_blank\" rel=\"noopener\">Coastal Wiki – Estuarine circulation<\/a><\/li>\n<li id=\"s-a3\"><a href=\"https://www.chemeurope.com/en/encyclopedia/Salinity.html\" target=\"_blank\" rel=\"noopener\">Venice system of salinity classes<\/a><\/li>\n<li id=\"s-a4\"><a href=\"https://www.coastalwiki.org/wiki/Estuarine_turbidity_maximum\" target=\"_blank\" rel=\"noopener\">Coastal Wiki – Estuarine turbidity maximum<\/a><\/li>\n<li id=\"s-a5\"><a href=\"https://coastalwiki.org/wiki/Tidal_bore_dynamics\" target=\"_blank\" rel=\"noopener\">Coastal Wiki – Tidal bore dynamics<\/a>; <a href=\"https://assets.publishing.service.gov.uk/media/5dc1525ded915d1cfe538e44/Severn_Estuary_SAC_and_SPA_Factsheet.pdf\" target=\"_blank\" rel=\"noopener\">Natural England – Severn Estuary factsheet<\/a><\/li>\n<li id=\"s-a6\"><a href=\"https://www.frontiersin.org/journals/marine-science/articles/10.3389/fmars.2023.1229486/full\" target=\"_blank\" rel=\"noopener\">Smeaton et al. 2023 – Saltmarsh carbon in Great Britain<\/a><\/li>\n<li id=\"s-a7\"><a href=\"https://ociweb.bto.org/sites/default/files/wituk-2023-24-report-bto-jncc-rspb-naturescot.pdf\" target=\"_blank\" rel=\"noopener\">BTO/JNCC/RSPB/NatureScot – Waterbirds in the UK 2023/24<\/a><\/li>\n<li id=\"s-a8\"><a href=\"https://gov.uk/government/news/salmon-stocks-in-england-lowest-on-record\" target=\"_blank\" rel=\"noopener\">Environment Agency – Salmon stocks lowest on record<\/a>; <a href=\"https://www.mcsuk.org/goodfishguide/species/european-eel/wild/150/\" target=\"_blank\" rel=\"noopener\">MCS – European eel<\/a>; <a href=\"https://www.nature.scot/plants-animals-and-fungi/fish/freshwater-fish/sparling\" target=\"_blank\" rel=\"noopener\">NatureScot – Sparling<\/a>; <a href=\"https://www.gov.uk/government/publications/presence-of-european-sea-bass-and-other-species-in-proposed-bass-nursery-areas\" target=\"_blank\" rel=\"noopener\">Defra – Bass nursery areas<\/a><\/li>\n<li id=\"s-a9\"><a href=\"https://www.metoffice.gov.uk/about-us/news-and-media/media-centre/weather-and-climate-news/2022/uk-climate-continues-to-change-in-2021\" target=\"_blank\" rel=\"noopener\">Met Office – State of the UK climate<\/a><\/li>\n<li id=\"s-a10\"><a href=\"https://www.gov.uk/government/news/environment-agency-storm-overflow-spill-data-for-2024\" target=\"_blank\" rel=\"noopener\">Environment Agency – Storm overflow spill data 2024<\/a><\/li>\n<li id=\"s-a11\"><a href=\"https://acct.metoffice.gov.uk/binaries/content/assets/metofficegovuk/pdf/research/ukcp/ukcp18-fact-sheet-sea-level-rise-and-storm-surge.pdf\" target=\"_blank\" rel=\"noopener\">Met Office – UKCP18 sea level rise factsheet<\/a><\/li>\n<li id=\"s-a12\"><a href=\"https://www.mccip.org.uk/sites/default/files/2021-08/coastal-habitats.pdf\" target=\"_blank\" rel=\"noopener\">MCCIP – Coastal habitats<\/a>; <a href=\"https://ice.org.uk/knowledge-and-resources/case-studies/managed-realignmentat-steart-somerset\" target=\"_blank\" rel=\"noopener\">ICE – Steart managed realignment<\/a><\/li>\n<\/ol><\/div>\n"}, "Thames": {"html": "<p class=\"kicker\">Tidal limit · Teddington Lock<\/p>\n<h2>The Thames: a capital's tidal river<\/h2>\n<p class=\"lead\">Twice a day the North Sea pushes 150 km inland, through the heart of London to a lock in the western suburbs. A river once written off as biologically dead now teems with fish, birds and seals.<\/p>\n<div class=\"facts\">\n<div><b>346 km<\/b><span>longest river entirely in England<sup><a href=\"#s-th1\">1<\/a><\/sup><\/span><\/div>\n<div><b>~7 m<\/b><span>spring tidal range in central London<sup><a href=\"#s-th1\">1<\/a><\/sup><\/span><\/div>\n<div><b>95 miles<\/b><span>of tidal river, Teddington to the sea<sup><a href=\"#s-th3\">3<\/a><\/sup><\/span><\/div>\n<div><b>115+<\/b><span>fish species recorded in the tidal Thames<sup><a href=\"#s-th5\">5<\/a><\/sup><\/span><\/div>\n<\/div>\n<h3>The river and the tide<\/h3>\n<p>The Thames rises in the Cotswolds and flows 346 km to the sea.<sup><a href=\"#s-th1\">1<\/a><\/sup> Since Teddington Lock was built in 1810–12, the tide stops there, about 243 km from the source; before that, spring tides reached as far as Staines.<sup><a href=\"#s-th2\">2<\/a><\/sup> As the estuary narrows towards London, the incoming tide is squeezed and amplified, so the range in the city, around 7 m, is larger than at the mouth.<sup><a href=\"#s-th1\">1<\/a><\/sup><\/p>\n<p>Fresh river water rides out over the denser seawater. Through west London the river is fresh but tidal; from around central London it turns brackish, and below Erith and Gravesend it is close to seawater. How far the salt reaches depends on the river's flow: in dry summers it pushes further upstream.<\/p>\n<h3>From dead river to wildlife corridor<\/h3>\n<p>In 1858 the \"Great Stink\" forced London to build Bazalgette's intercepting sewers, but by the mid-20th century much of the tidal river was again so short of oxygen that fish could not survive; in the 1950s stretches were described as biologically dead.<sup><a href=\"#s-th4\">4<\/a><\/sup> Sewage treatment transformed it. The Zoological Society of London's first State of the Thames report, in 2021, counted more than 115 fish species, 92 bird species and around 600 ha of saltmarsh. Some 20 fish species use the estuary as a nursery, and harbour and grey seals live in the outer estuary.<sup><a href=\"#s-th4\">4<\/a>,<a href=\"#s-th5\">5<\/a><\/sup><\/p>\n<p>The Thames Estuary and Marshes are a Ramsar site, supporting around 45,000 wintering waterbirds, including about 18% of Britain's avocets.<sup><a href=\"#s-th6\">6<\/a><\/sup> Smelt, a small fish that smells of cucumber, spawn in the upper tidal river.<\/p>\n<h3>People and the river<\/h3>\n<p>London grew where the Thames could be bridged and ships could reach on the tide. The river still serves the UK's largest port, and it supplies about two-thirds of London's drinking water.<sup><a href=\"#s-th1\">1<\/a>,<a href=\"#s-th3\">3<\/a><\/sup> After the North Sea flood of 1953 killed 307 people, London built the Thames Barrier at Woolwich, opened in 1984. It had closed 221 times by 2024 and protects 1.42 million people.<sup><a href=\"#s-th2\">2<\/a>,<a href=\"#s-th7\">7<\/a><\/sup><\/p>\n<h3>Under pressure<\/h3>\n<p>The recovery is not finished. Summer water temperatures are rising, nitrate is increasing and sea level near Tower Bridge has been rising by about 5 mm a year.<sup><a href=\"#s-th5\">5<\/a><\/sup> Storm overflows have long poured untreated sewage into the river after heavy rain; the 25 km Thames Tideway Tunnel, completed in 2025, is designed to capture about 95% of it.<sup><a href=\"#s-th8\">8<\/a><\/sup> The Thames Estuary 2100 plan expects about 1 m of sea-level rise by the end of the century and will need a decision on the future of the barrier by 2040.<sup><a href=\"#s-th7\">7<\/a><\/sup><\/p>\n<div class=\"src\"><b>Sources<\/b><ol>\n<li id=\"s-th1\"><a href=\"https://en.wikipedia.org/wiki/River_Thames\" target=\"_blank\" rel=\"noopener\">Wikipedia – River Thames<\/a><\/li>\n<li id=\"s-th2\"><a href=\"https://www.rgs.org/media/ktkhhk0n/riverslesson4theriverthamesfactsheet.pdf\" target=\"_blank\" rel=\"noopener\">Royal Geographical Society – River Thames factsheet<\/a><\/li>\n<li id=\"s-th3\"><a href=\"https://server1.pla.co.uk/About-Us/What-is-the-Port-of-London-Authority\" target=\"_blank\" rel=\"noopener\">Port of London Authority – About us<\/a><\/li>\n<li id=\"s-th4\"><a href=\"https://nhm.ac.uk/discover/news/2021/november/sharks-seahorses-and-seals-found-in-river-thames-first-health-check.html\" target=\"_blank\" rel=\"noopener\">Natural History Museum – First health check of the Thames<\/a><\/li>\n<li id=\"s-th5\"><a href=\"https://zsl.org/conservation/news/nature-recovery-for-thames-but-river-at-high-risk-from-sewage-and-climate-change\" target=\"_blank\" rel=\"noopener\">ZSL – State of the Thames<\/a><\/li>\n<li id=\"s-th6\"><a href=\"https://tnaqa.mirrorweb.com/ukgwa/20260303201053mp_/https://jncc.gov.uk/jncc-assets/RIS/UK11069.pdf\" target=\"_blank\" rel=\"noopener\">JNCC – Thames Estuary and Marshes Ramsar sheet<\/a><\/li>\n<li id=\"s-th7\"><a href=\"https://www.itv.com/news/london/2024-05-08/londons-future-flood-defences-plans-as-sleeping-giant-thames-barrier-turns-40\" target=\"_blank\" rel=\"noopener\">ITV News – The Thames Barrier turns 40<\/a><\/li>\n<li id=\"s-th8\"><a href=\"https://www.thechemicalengineer.com/news/london-completes-super-sewer-in-fight-against-river-spills/\" target=\"_blank\" rel=\"noopener\">The Chemical Engineer – London completes super sewer<\/a><\/li>\n<\/ol><\/div>\n"}, "Severn": {"html": "<p class=\"kicker\">Tidal limit · Gloucester<\/p>\n<h2>The Severn: a funnel for the second-highest tides on Earth<\/h2>\n<p class=\"lead\">Britain's longest river ends in an estuary shaped like a trumpet. It concentrates the Atlantic tide into a range of up to 14 m and sends a wave, the Severn bore, racing upstream towards Gloucester.<\/p>\n<div class=\"facts\">\n<div><b>354 km<\/b><span>longest river in Great Britain<sup><a href=\"#s-se1\">1<\/a><\/sup><\/span><\/div>\n<div><b>up to ~14 m<\/b><span>tidal range, second only to the Bay of Fundy<sup><a href=\"#s-se2\">2<\/a><\/sup><\/span><\/div>\n<div><b>~250×<\/b><span>bores per year, up to about 2 m high<sup><a href=\"#s-se4\">4<\/a><\/sup><\/span><\/div>\n<div><b>~74,000<\/b><span>wintering waterbirds on average<sup><a href=\"#s-se2\">2<\/a><\/sup><\/span><\/div>\n<\/div>\n<h3>The river and the tide<\/h3>\n<p>The Severn rises on Plynlimon in mid-Wales at about 610 m and loops through Shropshire and Worcestershire before reaching the sea.<sup><a href=\"#s-se1\">1<\/a><\/sup> The tide stops at two weirs in Gloucester, Maisemore and Llanthony.<sup><a href=\"#s-se1\">1<\/a><\/sup> Below them the estuary widens like a funnel. As the tidal wave moves into ever narrower, shallower water it piles up, giving the Severn a range of up to about 14 m, among the largest in the world.<sup><a href=\"#s-se2\">2<\/a>,<a href=\"#s-se3\">3<\/a><\/sup><\/p>\n<p>On big spring tides the rising water breaks into a bore, a travelling wave up to about 2 m high moving at 10–13 mph. It runs on around 250 tides a year and is at its biggest near the equinoxes.<sup><a href=\"#s-se4\">4<\/a><\/sup> Tidal currents of up to 7 m/s keep millions of tonnes of silt in suspension, which is why the estuary looks brown.<sup><a href=\"#s-se2\">2<\/a><\/sup> With so much mixing, salinity grades smoothly from seawater at the bridges to fresh water above Arlingham.<\/p>\n<h3>Life in a fierce estuary<\/h3>\n<p>The Severn Estuary is a Ramsar site, Special Protection Area and Special Area of Conservation.<sup><a href=\"#s-se3\">3<\/a>,<a href=\"#s-se5\">5<\/a><\/sup> Its mudflats, sandbanks and saltmarsh support around 74,000 wintering birds, more in cold winters, including internationally important numbers of black-tailed godwit; it is also the top site in the UK for European white-fronted geese.<sup><a href=\"#s-se2\">2<\/a>,<a href=\"#s-se5\">5<\/a><\/sup> More than 100 fish species are recorded, among them salmon, sea trout, eel, sea and river lamprey and twaite shad.<sup><a href=\"#s-se2\">2<\/a>,<a href=\"#s-se3\">3<\/a><\/sup><\/p>\n<p>Shad once ran up the Severn in their hundreds of thousands until 19th-century navigation weirs blocked them. The Unlocking the Severn project built fish passes that reopened about 158 miles of river, and in 2022 twaite shad spawned above the weirs for the first time in nearly 180 years.<sup><a href=\"#s-se6\">6<\/a><\/sup><\/p>\n<h3>People and the river<\/h3>\n<p>The Severn carried the Industrial Revolution: the world's first cast-iron bridge was built over it at Ironbridge in 1779, now a UNESCO World Heritage Site.<sup><a href=\"#s-se1\">1<\/a><\/sup> Today rail and road cross the estuary by the Severn Tunnel and two great bridges, and towns such as Shrewsbury and Bewdley still flood regularly.<sup><a href=\"#s-se1\">1<\/a><\/sup><\/p>\n<h3>Power from the tide?<\/h3>\n<p>So much moving water has tempted engineers since 1849. A government study in 2010 rejected a £34 billion barrage from Cardiff to Weston that could have met about 5% of UK electricity demand, citing its cost and risk and the harm to the habitats of some 30 bird species.<sup><a href=\"#s-se2\">2<\/a>,<a href=\"#s-se7\">7<\/a><\/sup> The question returns with every energy debate: how much of an estuary's tide can be taken without losing what makes it valuable.<\/p>\n<div class=\"src\"><b>Sources<\/b><ol>\n<li id=\"s-se1\"><a href=\"https://en.wikipedia.org/wiki/River_Severn\" target=\"_blank\" rel=\"noopener\">Wikipedia – River Severn<\/a><\/li>\n<li id=\"s-se2\"><a href=\"https://www.rspb.org.uk/helping-nature/what-we-do/influence-government-and-business/casework/the-severn-estuary\" target=\"_blank\" rel=\"noopener\">RSPB – The Severn Estuary<\/a><\/li>\n<li id=\"s-se3\"><a href=\"https://assets.publishing.service.gov.uk/media/5dc1525ded915d1cfe538e44/Severn_Estuary_SAC_and_SPA_Factsheet.pdf\" target=\"_blank\" rel=\"noopener\">Natural England – Severn Estuary SAC and SPA factsheet<\/a><\/li>\n<li id=\"s-se4\"><a href=\"https://www.gloucestershire.gov.uk/media/g4em3gxg/4-2a-severn-bore-factsheet.pdf\" target=\"_blank\" rel=\"noopener\">Gloucestershire County Council – Severn bore factsheet<\/a><\/li>\n<li id=\"s-se5\"><a href=\"https://rsis.ramsar.org/ris/67\" target=\"_blank\" rel=\"noopener\">Ramsar Sites Information Service – Severn Estuary<\/a><\/li>\n<li id=\"s-se6\"><a href=\"https://canalrivertrust.org.uk/canals-and-rivers/river-severn-navigation/unlocking-the-severn\" target=\"_blank\" rel=\"noopener\">Canal &amp; River Trust – Unlocking the Severn<\/a><\/li>\n<li id=\"s-se7\"><a href=\"https://khl.com/news/Feasibility-study-finds-against-UK-s-Severn-barrage/1059046.article\" target=\"_blank\" rel=\"noopener\">KHL – Feasibility study finds against Severn barrage<\/a><\/li>\n<\/ol><\/div>\n"}, "Mersey": {"html": "<p class=\"kicker\">Tidal limit · Howley Weir, Warrington<\/p>\n<h2>The Mersey: from open sewer to living estuary<\/h2>\n<p class=\"lead\">In 1985 the Mersey was called the most polluted estuary in Britain. Four decades of clean-up later, salmon leap the weirs at Warrington and porpoises feed off Liverpool.<\/p>\n<div class=\"facts\">\n<div><b>110 km<\/b><span>long, including a 26 km estuary<sup><a href=\"#s-m1\">1<\/a><\/sup><\/span><\/div>\n<div><b>4–10 m<\/b><span>tidal range, neap to spring<sup><a href=\"#s-m2\">2<\/a><\/sup><\/span><\/div>\n<div><b>5 million+<\/b><span>people live and work in the catchment<sup><a href=\"#s-m1\">1<\/a><\/sup><\/span><\/div>\n<div><b>~5,000 ha<\/b><span>Ramsar site for wintering birds<sup><a href=\"#s-m3\">3<\/a><\/sup><\/span><\/div>\n<\/div>\n<h3>The river and the tide<\/h3>\n<p>The Mersey forms near Stockport and flows west through Manchester's suburbs to Warrington, where the tide stops at Howley Weir. The highest spring tides overtop it.<sup><a href=\"#s-m2\">2<\/a><\/sup> Below Runcorn the river opens into a broad basin up to 4.8 km wide, then funnels through a narrow neck only about 1.1 km wide between Liverpool and Birkenhead.<sup><a href=\"#s-m2\">2<\/a><\/sup> That shape gives the Mersey the second-largest tidal range in Britain, up to about 10 m at springs.<sup><a href=\"#s-m2\">2<\/a><\/sup> Each tide floods and drains the basin, scouring deep channels through shifting sandbanks; the upper estuary at Runcorn is brackish, while the Narrows are close to full seawater.<\/p>\n<h3>Collapse and recovery<\/h3>\n<p>Liverpool's first dock opened in 1715, and two centuries of industry followed along the river and the Manchester Ship Canal. By 1985 the estuary was receiving up to 60% of mainland Britain's industrial pollution, and its sediments still hold mercury, DDT and PCBs.<sup><a href=\"#s-m1\">1<\/a><\/sup> After the 1981 riots, the Environment Secretary Michael Heseltine called the river \"an open sewer\", and in 1985 the Mersey Basin Campaign set out a 25-year plan to clean it.<sup><a href=\"#s-m4\">4<\/a><\/sup><\/p>\n<p>New treatment works, including Sandon Dock, replaced 28 outfalls that had discharged raw sewage straight into the river.<sup><a href=\"#s-m1\">1<\/a><\/sup> In 2002 oxygen levels able to support fish were recorded along the whole river for the first time since industrialisation.<sup><a href=\"#s-m2\">2<\/a><\/sup> Salmon, sea trout, lamprey, grey seals and harbour porpoises have returned.<sup><a href=\"#s-m1\">1<\/a><\/sup><\/p>\n<h3>Life in the estuary<\/h3>\n<p>The Mersey Estuary is a Ramsar site and Special Protection Area of about 5,000 ha.<sup><a href=\"#s-m3\">3<\/a><\/sup> Its saltmarsh and mudflats hold internationally important flocks of dunlin, teal, pintail, redshank, shelduck, golden plover and black-tailed godwit in winter.<sup><a href=\"#s-m5\">5<\/a><\/sup><\/p>\n<h3>People and the river<\/h3>\n<p>The Mersey made Liverpool one of the world's great ports. Its 12 km of docks, the Manchester Ship Canal opened in 1894, three tunnels and the Mersey Gateway bridge all bear witness to the river's economic weight. It gave its name to a whole sound in popular music, Merseybeat.<sup><a href=\"#s-m2\">2<\/a>,<a href=\"#s-m6\">6<\/a><\/sup><\/p>\n<h3>Looking ahead<\/h3>\n<p>The same large tides attract plans for a tidal barrage of about 700 MW, which would be the world's largest tidal-range power scheme; it is still at the planning stage.<sup><a href=\"#s-m7\">7<\/a><\/sup> Recreational disturbance and development, such as airport expansion, remain the main pressures listed for the protected site.<sup><a href=\"#s-m5\">5<\/a><\/sup><\/p>\n<div class=\"src\"><b>Sources<\/b><ol>\n<li id=\"s-m1\"><a href=\"https://mail.merseybasin.org.uk/archive/assets/5/original/MERSEY_6_MINUTE_EXPERT.pdf\" target=\"_blank\" rel=\"noopener\">Mersey Basin Campaign – Six-minute expert<\/a><\/li>\n<li id=\"s-m2\"><a href=\"https://en.wikipedia.org/wiki/River_Mersey\" target=\"_blank\" rel=\"noopener\">Wikipedia – River Mersey<\/a><\/li>\n<li id=\"s-m3\"><a href=\"https://rsis.ramsar.org/ris/785\" target=\"_blank\" rel=\"noopener\">Ramsar Sites Information Service – Mersey Estuary<\/a><\/li>\n<li id=\"s-m4\"><a href=\"https://merseybasin.org.uk/collections/it_took_a_riot.html\" target=\"_blank\" rel=\"noopener\">Mersey Basin Campaign – It took a riot<\/a><\/li>\n<li id=\"s-m5\"><a href=\"https://assets.publishing.service.gov.uk/media/5def775ce5274a71e5049260/Mersey_Estuary_SPA_Factsheet.pdf\" target=\"_blank\" rel=\"noopener\">Natural England – Mersey Estuary SPA factsheet<\/a><\/li>\n<li id=\"s-m6\"><a href=\"https://www.ice.org.uk/what-is-civil-engineering/infrastructure-projects/manchester-ship-canal\" target=\"_blank\" rel=\"noopener\">ICE – Manchester Ship Canal<\/a><\/li>\n<li id=\"s-m7\"><a href=\"https://www.iom3.org/resource/river-mersey-tidal-scheme-plan-progressed.html\" target=\"_blank\" rel=\"noopener\">IOM3 – River Mersey tidal scheme plan progressed<\/a><\/li>\n<\/ol><\/div>\n"}, "Humber": {"html": "<p class=\"kicker\">Ouse · Trent · Humber<\/p>\n<h2>The Humber: England's great drain<\/h2>\n<p class=\"lead\">A fifth of England empties through one muddy funnel. Here the North Sea pushes far inland on two rivers at once, and the estuary feeds some of the largest gatherings of wading birds in Europe.<\/p>\n<div class=\"facts\">\n<div><b>~24,500 km²<\/b><span>catchment, about 20% of England<sup><a href=\"#s-h1\">1<\/a><\/sup><\/span><\/div>\n<div><b>5.7–7.4 m<\/b><span>mean spring tidal range, Spurn to Saltend<sup><a href=\"#s-h1\">1<\/a><\/sup><\/span><\/div>\n<div><b>Naburn &amp; Cromwell<\/b><span>tidal limits on the Ouse and the Trent<sup><a href=\"#s-h3\">3<\/a><\/sup><\/span><\/div>\n<div><b>~154,000<\/b><span>wintering waterbirds (5-year peak mean)<sup><a href=\"#s-h5\">5<\/a><\/sup><\/span><\/div>\n<\/div>\n<h3>Two rivers, one estuary<\/h3>\n<p>The Humber has no source of its own. It begins at Trent Falls, where the tidal Yorkshire Ouse and the tidal Trent meet, and runs about 60 km to Spurn Head. Above that confluence the tide reaches Naburn Lock just south of York on the Ouse, and Cromwell Lock near Newark on the Trent.<sup><a href=\"#s-h3\">3<\/a><\/sup> On the highest spring tides the Trent carries a tidal bore, the Aegir, a wave of up to about 1.5 m that can be watched at Gainsborough.<sup><a href=\"#s-h4\">4<\/a><\/sup><\/p>\n<p>The estuary is macrotidal and narrows inland, so the tide is amplified: the mean spring range grows from 5.7 m at Spurn to 7.4 m at Saltend near Hull.<sup><a href=\"#s-h1\">1<\/a><\/sup> It is also one of the most turbid estuaries in Britain. Each tide moves well over a thousand tonnes of sediment, much of it eroded from the soft boulder-clay cliffs of Holderness and carried in from the sea rather than down the rivers.<sup><a href=\"#s-h1\">1<\/a>,<a href=\"#s-h2\">2<\/a><\/sup> Where fresh and salt water meet, this mud concentrates into a turbidity maximum that moves tens of kilometres up and down the estuary with the seasons, following river flow.<\/p>\n<h3>Life in the mud<\/h3>\n<p>That mud is the estuary's wealth. The Humber is protected as a Ramsar site, a Special Protection Area and a Special Area of Conservation covering about 37,000 ha.<sup><a href=\"#s-h2\">2<\/a>,<a href=\"#s-h5\">5<\/a>,<a href=\"#s-h6\">6<\/a><\/sup> Its mudflats feed a wintering waterbird assemblage of around 154,000 birds, including about 12% of Britain's golden plover, together with large flocks of knot and dunlin.<sup><a href=\"#s-h5\">5<\/a><\/sup> Avocets and bitterns breed on its margins.<\/p>\n<p>Sea and river lampreys pass through the estuary to spawn in the River Derwent, a tributary of the Ouse, which is why they are listed features of the protected site.<sup><a href=\"#s-h2\">2<\/a><\/sup> At Donna Nook, just south of the mouth, grey seals haul out each winter to give birth; around 1,900 pups were born there in 2025.<sup><a href=\"#s-h7\">7<\/a><\/sup><\/p>\n<h3>People and the tide<\/h3>\n<p>The Humber ports (Immingham, Grimsby, Hull and Goole) together form one of the UK's largest port complexes, handling roughly 70 million tonnes of cargo a year.<sup><a href=\"#s-h8\">8<\/a><\/sup> The same tides are a threat. On 5 December 2013 the largest surge on record flooded about 1,100 properties and over 7,000 ha; the Hull tidal barrier held with 40 cm to spare. In 1953 a North Sea surge killed around 300 people along England's east coast.<sup><a href=\"#s-h8\">8<\/a>,<a href=\"#s-h9\">9<\/a><\/sup><\/p>\n<h3>Making room for water<\/h3>\n<p>Sea level on the Humber is projected to rise by 1.0–1.3 m over the next century. Where seawalls stand fixed, intertidal habitat is squeezed out, so the estuary is now partly being given land back. At Alkborough Flats, at the Trent–Ouse confluence, a 440 ha field was deliberately opened to the tide in 2006. It has become new marsh and mudflat, and in an extreme surge it lowers water levels upstream by more than 15 cm.<sup><a href=\"#s-h8\">8<\/a>,<a href=\"#s-h10\">10<\/a><\/sup><\/p>\n<div class=\"src\"><b>Sources<\/b><ol>\n<li id=\"s-h1\"><a href=\"https://humbernature.co.uk/estuary\" target=\"_blank\" rel=\"noopener\">Humber Nature Partnership – The estuary<\/a><\/li>\n<li id=\"s-h2\"><a href=\"https://sac.jncc.gov.uk/site/UK0030170\" target=\"_blank\" rel=\"noopener\">JNCC – Humber Estuary SAC<\/a><\/li>\n<li id=\"s-h3\"><a href=\"https://waterways.org.uk/waterways/discover-the-waterways/river-trent\" target=\"_blank\" rel=\"noopener\">Inland Waterways Association – River Trent<\/a><\/li>\n<li id=\"s-h4\"><a href=\"https://en.wikipedia.org/wiki/Trent_Aegir\" target=\"_blank\" rel=\"noopener\">Wikipedia – Trent Aegir<\/a><\/li>\n<li id=\"s-h5\"><a href=\"https://publications.naturalengland.org.uk/file/3302589\" target=\"_blank\" rel=\"noopener\">Natural England – Humber Estuary SPA citation<\/a><\/li>\n<li id=\"s-h6\"><a href=\"https://rsis.ramsar.org/ris/663\" target=\"_blank\" rel=\"noopener\">Ramsar Sites Information Service – Humber Estuary<\/a><\/li>\n<li id=\"s-h7\"><a href=\"https://www.lincstrust.org.uk/node/1615\" target=\"_blank\" rel=\"noopener\">Lincolnshire Wildlife Trust – Donna Nook seals<\/a><\/li>\n<li id=\"s-h8\"><a href=\"https://consult.environment-agency.gov.uk/humber/strategyreview/user_uploads/humber-2100--storymap-content-for-website.pdf\" target=\"_blank\" rel=\"noopener\">Environment Agency – Humber 2100+<\/a><\/li>\n<li id=\"s-h9\"><a href=\"https://humbersidefire.gov.uk/newsroom/news/ten-years-on-from-humber-tidal-surge\" target=\"_blank\" rel=\"noopener\">Humberside Fire &amp; Rescue – Ten years on from the tidal surge<\/a><\/li>\n<li id=\"s-h10\"><a href=\"https://www.ice.org.uk/engineering-resources/case-studies/managed-realignment-alkborough-flats-lincolnshire/\" target=\"_blank\" rel=\"noopener\">ICE – Managed realignment at Alkborough Flats<\/a><\/li>\n<\/ol><\/div>\n"}, "Tyne": {"html": "<p class=\"kicker\">Tidal limit · Wylam<\/p>\n<h2>The Tyne: from coal river to salmon river<\/h2>\n<p class=\"lead\">For centuries the Tyne carried coal and launched ships. Its estuary was among the most polluted in Britain. Today it is one of the best salmon rivers in the country.<\/p>\n<div class=\"facts\">\n<div><b>~118 km<\/b><span>length, North Tyne source to the sea<sup><a href=\"#s-t1\">1<\/a><\/sup><\/span><\/div>\n<div><b>2,936 km²<\/b><span>catchment<sup><a href=\"#s-t1\">1<\/a><\/sup><\/span><\/div>\n<div><b>~23 km<\/b><span>tidal, from Wylam to the North Sea<sup><a href=\"#s-t2\">2<\/a>,<a href=\"#s-t3\">3<\/a><\/sup><\/span><\/div>\n<div><b>1,780<\/b><span>salmon caught by anglers in 2024, the most in England<sup><a href=\"#s-t4\">4<\/a><\/sup><\/span><\/div>\n<\/div>\n<h3>A river remade<\/h3>\n<p>The North Tyne rises in the Cheviots near Kielder and the South Tyne in the Pennines; they meet near Hexham.<sup><a href=\"#s-t1\">1<\/a><\/sup> For more than five hundred years the tide stopped at Hedwin Streams, a shallow rapid near Newburn marked by a Tide Stone that set the upstream limit of the Port of Newcastle. In the 19th century the river was dredged so deeply that the rapid disappeared, and the tide now runs on to Wylam.<sup><a href=\"#s-t3\">3<\/a><\/sup> The Tyne Improvement Commission deepened the channel from under 2 m to over 9 m, turning a shallow, shoal-filled river into a deep-water port.<sup><a href=\"#s-t5\">5<\/a><\/sup> Because the estuary is short and narrow, salt water reaches up through Newcastle on the flood tide and the brackish zone is compressed into a few kilometres.<\/p>\n<h3>Coal, ships and pollution<\/h3>\n<p>Coal was shipped from the Tyne from the 13th century, and by the late 19th century its yards were among the leading shipbuilding centres in the world.<sup><a href=\"#s-t5\">5<\/a><\/sup> Industry and untreated sewage took their toll: the century from about 1850 to 1950 was the worst for pollution, and the estuary became too poor in oxygen for migratory fish to pass.<sup><a href=\"#s-t5\">5<\/a><\/sup><\/p>\n<h3>The return of the salmon<\/h3>\n<p>Recovery began in the late 1960s. New pollution laws and the Howdon sewage works, built in the 1970s to intercept the city's waste, cleaned up the estuary.<sup><a href=\"#s-t6\">6<\/a>,<a href=\"#s-t7\">7<\/a><\/sup> Kielder Water, completed around 1982 and still the largest artificial lake in the UK by capacity, cut off part of the salmon's spawning grounds. A hatchery, the Kielder Salmon Centre, has released young salmon into the river since 1978 to make up for it.<sup><a href=\"#s-t7\">7<\/a>,<a href=\"#s-t8\">8<\/a><\/sup> The result is one of the clearest recovery stories in British rivers: in 2024 the Tyne's anglers recorded 1,780 salmon, nearly 30% of the entire rod catch of England and Wales, and released more than 90% of them.<sup><a href=\"#s-t4\">4<\/a><\/sup><\/p>\n<p>The city has gained an unexpected seabird too. Kittiwakes, normally cliff-nesters, breed on the Tyne Bridge and nearby buildings in what is described as the most inland kittiwake colony in the world.<sup><a href=\"#s-t9\">9<\/a><\/sup><\/p>\n<h3>Living with the river<\/h3>\n<p>The Tyne is still a working river, run by the Port of Tyne since 1968.<sup><a href=\"#s-t5\">5<\/a><\/sup> Floods are part of its history: in November 1771 a great flood swept away the medieval Tyne Bridge in Newcastle.<sup><a href=\"#s-t10\">10<\/a><\/sup> Its future depends on keeping water quality high and passage open for fish, while the climate warms the rivers that salmon need cold.<\/p>\n<div class=\"src\"><b>Sources<\/b><ol>\n<li id=\"s-t1\"><a href=\"https://www.tyneriverstrust.org/?p=46\" target=\"_blank\" rel=\"noopener\">Tyne Rivers Trust – The Tyne catchment<\/a><\/li>\n<li id=\"s-t2\"><a href=\"https://www.britannica.com/place/River-Tyne\" target=\"_blank\" rel=\"noopener\">Britannica – River Tyne<\/a><\/li>\n<li id=\"s-t3\"><a href=\"https://sitelines.newcastle.gov.uk/SMR/1353\" target=\"_blank\" rel=\"noopener\">Tyne and Wear HER – Hedwin Streams tide stone<\/a><\/li>\n<li id=\"s-t4\"><a href=\"https://www.gov.uk/government/publications/salmonid-and-freshwater-fisheries-statistics-for-2024/salmonid-and-freshwater-fisheries-statistics-for-2024\" target=\"_blank\" rel=\"noopener\">Environment Agency – Salmonid and freshwater fisheries statistics 2024<\/a><\/li>\n<li id=\"s-t5\"><a href=\"https://en.wikipedia.org/wiki/River_Tyne\" target=\"_blank\" rel=\"noopener\">Wikipedia – River Tyne<\/a><\/li>\n<li id=\"s-t6\"><a href=\"https://www.tyneriverstrust.org/?p=9279\" target=\"_blank\" rel=\"noopener\">Tyne Rivers Trust – Recovery of the Tyne<\/a><\/li>\n<li id=\"s-t7\"><a href=\"https://www.gov.uk/government/news/busy-40th-year-for-kielder-salmon-centre\" target=\"_blank\" rel=\"noopener\">GOV.UK – Busy 40th year for Kielder Salmon Centre<\/a><\/li>\n<li id=\"s-t8\"><a href=\"https://ice.org.uk/what-is-civil-engineering/infrastructure-projects/kielder-water-scheme\" target=\"_blank\" rel=\"noopener\">ICE – Kielder Water scheme<\/a><\/li>\n<li id=\"s-t9\"><a href=\"https://www.tynekittiwakes.org.uk/tyne-kittiwake-colonies/\" target=\"_blank\" rel=\"noopener\">Tyne Kittiwakes Partnership<\/a><\/li>\n<li id=\"s-t10\"><a href=\"https://www.northeastmuseums.org.uk/collections/stories/the-night-the-tyne-bridge-fell/\" target=\"_blank\" rel=\"noopener\">North East Museums – The night the Tyne Bridge fell<\/a><\/li>\n<\/ol><\/div>\n"}, "Clyde": {"html": "<p class=\"kicker\">Tidal limit · tidal weir, Glasgow Green<\/p>\n<h2>The Clyde: the river that built ships<\/h2>\n<p class=\"lead\">Glasgow dredged a shallow salmon river into a deep-water highway and made it the world's greatest shipbuilding centre. When the yards closed, the salmon came back.<\/p>\n<div class=\"facts\">\n<div><b>~170 km<\/b><span>long, Scotland's third-longest river<sup><a href=\"#s-c1\">1<\/a><\/sup><\/span><\/div>\n<div><b>~1.8 million<\/b><span>people live in its catchment, a third of Scotland<sup><a href=\"#s-c2\">2<\/a><\/sup><\/span><\/div>\n<div><b>25,000+<\/b><span>ships built on the Clyde since 1712<sup><a href=\"#s-c2\">2<\/a><\/sup><\/span><\/div>\n<div><b>~2,100<\/b><span>redshank wintering on the inner estuary<sup><a href=\"#s-c3\">3<\/a><\/sup><\/span><\/div>\n<\/div>\n<h3>A river made deep<\/h3>\n<p>The Clyde rises in the Southern Uplands and flows north-west through Lanark and Glasgow to its firth.<sup><a href=\"#s-c1\">1<\/a><\/sup> It was once a shallow river that large ships could not reach; from the 18th century onwards it was dredged into a deep channel so that they could sail into the heart of Glasgow.<sup><a href=\"#s-c1\">1<\/a><\/sup> The deepened channel let the tide reach the city much faster: by 1873 its travel time from Greenock to Glasgow had fallen from three hours to just over one. The tide is also amplified on its way upstream, so it is about 20% larger at Glasgow than at Greenock.<sup><a href=\"#s-c4\">4<\/a><\/sup><\/p>\n<p>Unusually, the boundary between fresh and salt water on the Clyde is a single structure. The tidal weir at Glasgow Green, opened in 1901 and rebuilt in 1949, holds the river level steady upstream and marks the tidal limit.<sup><a href=\"#s-c5\">5<\/a>,<a href=\"#s-c6\">6<\/a><\/sup> Above it the river is fresh; below it the water is brackish all the way through the city, becoming full seawater towards Dumbarton and Greenock. Two different ecosystems meet at one wall.<\/p>\n<h3>Ships and pollution<\/h3>\n<p>The deep channel turned Glasgow into the world's largest shipbuilding centre.<sup><a href=\"#s-c1\">1<\/a><\/sup> More than 25,000 ships were built on the Clyde, with over 370 launched in 1913 alone, among them the Lusitania, the Queen Mary and the QE2.<sup><a href=\"#s-c2\">2<\/a>,<a href=\"#s-c7\">7<\/a><\/sup> Industry and sewage made the river one of the dirtiest in Britain; salmon disappeared in the 19th century, and the estuary's sediments still carry PCBs and other legacy pollutants.<sup><a href=\"#s-c2\">2<\/a>,<a href=\"#s-c8\">8<\/a><\/sup><\/p>\n<h3>The return<\/h3>\n<p>As heavy industry closed and sewage treatment improved, the river began to recover. Salmon re-established themselves in the 1980s, and the Clyde now yields several hundred a year.<sup><a href=\"#s-c8\">8<\/a><\/sup> More than £600 million was invested in wastewater from 2010 to 2021, and around 100 km of waterways have been reopened to fish by removing barriers.<sup><a href=\"#s-c9\">9<\/a><\/sup> The Inner Clyde Estuary is now a Ramsar site and Special Protection Area for its wintering redshank, about 1% of the East Atlantic population.<sup><a href=\"#s-c3\">3<\/a><\/sup><\/p>\n<h3>Still a river in recovery<\/h3>\n<p>Two-thirds of the Clyde's water bodies are still below good ecological status.<sup><a href=\"#s-c10\">10<\/a><\/sup> Sea-level rise will increase flood risk around the firth, and Glasgow, built on the river, will have to adapt to it.<sup><a href=\"#s-c11\">11<\/a><\/sup><\/p>\n<div class=\"src\"><b>Sources<\/b><ol>\n<li id=\"s-c1\"><a href=\"https://www.britannica.com/place/River-Clyde\" target=\"_blank\" rel=\"noopener\">Britannica – River Clyde<\/a><\/li>\n<li id=\"s-c2\"><a href=\"https://en.wikipedia.org/wiki/River_Clyde\" target=\"_blank\" rel=\"noopener\">Wikipedia – River Clyde<\/a><\/li>\n<li id=\"s-c3\"><a href=\"https://www.nature.scot/sites/default/files/ramsar-site/8429/ramsar-site-citation.pdf\" target=\"_blank\" rel=\"noopener\">NatureScot – Inner Clyde Estuary Ramsar citation<\/a><\/li>\n<li id=\"s-c4\"><a href=\"https://nora.nerc.ac.uk/id/eprint/537883/1/woodworth_clyde_Scottish_Geographical_Journal_NORA_version_2024.pdf\" target=\"_blank\" rel=\"noopener\">Woodworth 2024 – Tides of the Clyde (NERC)<\/a><\/li>\n<li id=\"s-c5\"><a href=\"https://canmore.org.uk/site/103494\" target=\"_blank\" rel=\"noopener\">Canmore – Glasgow Green tidal weir<\/a><\/li>\n<li id=\"s-c6\"><a href=\"https://glasgow.gov.uk/tidalweir\" target=\"_blank\" rel=\"noopener\">Glasgow City Council – Tidal weir<\/a><\/li>\n<li id=\"s-c7\"><a href=\"https://www.scotlandspeople.gov.uk/research-guides/ships-and-shipbuilding\" target=\"_blank\" rel=\"noopener\">ScotlandsPeople – Ships and shipbuilding<\/a><\/li>\n<li id=\"s-c8\"><a href=\"https://tfn.scot/features/song-of-the-clyde-saving-scotlands-greatest-river\" target=\"_blank\" rel=\"noopener\">The Ferret – Song of the Clyde<\/a><\/li>\n<li id=\"s-c9\"><a href=\"https://www.gov.scot/news/back-to-health-for-the-river-clyde/\" target=\"_blank\" rel=\"noopener\">Scottish Government – Back to health for the River Clyde<\/a><\/li>\n<li id=\"s-c10\"><a href=\"https://www.fishpal.com/scotland/clyde/rivermanagement.html\" target=\"_blank\" rel=\"noopener\">Clyde river management (FishPal)<\/a><\/li>\n<li id=\"s-c11\"><a href=\"https://presscentre.nature.scot/news/future-sea-level-rise-will-increase-potential-flood-risks-in-firth-of-clyde-area\" target=\"_blank\" rel=\"noopener\">NatureScot – Sea-level rise and flood risk in the Firth of Clyde<\/a><\/li>\n<\/ol><\/div>\n"}, "Forth": {"html": "<p class=\"kicker\">Tidal limit · Stirling<\/p>\n<h2>The Forth: a winding river, a vast firth<\/h2>\n<p class=\"lead\">Short as a river and enormous as an estuary, the Forth meanders past Stirling Castle before opening into a 100 km firth of mudflats, ports and Scotland's most famous bridges.<\/p>\n<div class=\"facts\">\n<div><b>~100 km<\/b><span>of tidal water, Stirling to the Isle of May<sup><a href=\"#s-f1\">1<\/a><\/sup><\/span><\/div>\n<div><b>3,600+ km²<\/b><span>drained by the Forth and its firth<sup><a href=\"#s-f2\">2<\/a><\/sup><\/span><\/div>\n<div><b>~72,000<\/b><span>wintering waterbirds (5-year peak mean)<sup><a href=\"#s-f2\">2<\/a><\/sup><\/span><\/div>\n<div><b>1 of 3<\/b><span>Scottish rivers where sparling still survive<sup><a href=\"#s-f4\">4<\/a><\/sup><\/span><\/div>\n<\/div>\n<h3>The river and the tide<\/h3>\n<p>The Forth rises in the Trossachs and becomes tidal at Stirling.<sup><a href=\"#s-f3\">3<\/a><\/sup> Below the town it loops through a series of broad meanders before widening at Alloa and Kincardine into a firth that runs about 100 km to the Isle of May.<sup><a href=\"#s-f1\">1<\/a><\/sup> The water grades from fresh at Stirling to brackish around Alloa and fully saline in the outer firth.<sup><a href=\"#s-f2\">2<\/a><\/sup><\/p>\n<p>Near Alloa, where fresh and salt water meet, the Forth has one of the strongest turbidity maxima in Scotland. In summer, suspended sediment can reach 400–500 mg per litre, several times higher than in the Tay. Bacteria in this mud consume oxygen, and dissolved oxygen can briefly drop below 2 mg/l, a level stressful for fish. SEPA has monitored it with a buoy since 1988.<sup><a href=\"#s-f5\">5<\/a>,<a href=\"#s-f6\">6<\/a><\/sup><\/p>\n<h3>Life in the firth<\/h3>\n<p>The Firth of Forth is a Ramsar site and Special Protection Area of about 6,300 ha of mudflats, saltmarsh, rocky shores and beaches.<sup><a href=\"#s-f7\">7<\/a><\/sup> It supports around 72,000 wintering waterbirds, including internationally important numbers of pink-footed geese, knot, redshank and bar-tailed godwit, and Slavonian grebes on the open water.<sup><a href=\"#s-f2\">2<\/a><\/sup> On the Isle of May at its mouth, up to 2,000 grey seal pups are born each autumn, the largest colony in eastern Britain.<sup><a href=\"#s-f8\">8<\/a><\/sup><\/p>\n<p>The Forth also holds one of Scotland's rarest fish. Sparling, or smelt, were once found in 15 Scottish rivers and now survive only in the Cree, the Forth and the Tay. They spawn near the tidal limit between February and April.<sup><a href=\"#s-f4\">4<\/a><\/sup> Forth fishers caught 10–15 tonnes a year into the 1950s before the population crashed in the 1960s, probably from pollution, overfishing and power-station water intakes.<sup><a href=\"#s-f9\">9<\/a><\/sup><\/p>\n<h3>People and the firth<\/h3>\n<p>The firth has long been a gateway to Scotland. Stirling was a busy port in the 16th and 17th centuries.<sup><a href=\"#s-f3\">3<\/a><\/sup> The Forth Bridge, opened in 1890 with 6.5 million rivets, is a UNESCO World Heritage Site; it is flanked by the Forth Road Bridge (1964) and the Queensferry Crossing (2017).<sup><a href=\"#s-f3\">3<\/a>,<a href=\"#s-f10\">10<\/a><\/sup> Leith is Scotland's largest enclosed deep-water port and now a hub for offshore wind.<sup><a href=\"#s-f11\">11<\/a><\/sup> At Rosyth, the Royal Navy's two largest aircraft carriers were assembled.<sup><a href=\"#s-f12\">12<\/a><\/sup><\/p>\n<h3>A changing estuary<\/h3>\n<p>In 2025 Grangemouth, Britain's oldest oil refinery, stopped processing crude oil and became an import terminal, a sign of an industrial estuary in transition.<sup><a href=\"#s-f13\">13<\/a><\/sup> Much of the shoreline has been straightened and reinforced, which limits room for mudflats and marsh as the sea rises.<sup><a href=\"#s-f1\">1<\/a><\/sup><\/p>\n<div class=\"src\"><b>Sources<\/b><ol>\n<li id=\"s-f1\"><a href=\"https://forthriverstrust.org/rivers-wildlife/explore/estuary-and-firth/\" target=\"_blank\" rel=\"noopener\">Forth Rivers Trust – Estuary and firth<\/a><\/li>\n<li id=\"s-f2\"><a href=\"https://rsisd10.unepgrid.ch/RISapp/files/RISrep/GB1111RIS.pdf\" target=\"_blank\" rel=\"noopener\">Ramsar Information Sheet – Firth of Forth<\/a><\/li>\n<li id=\"s-f3\"><a href=\"https://en.wikipedia.org/wiki/River_Forth\" target=\"_blank\" rel=\"noopener\">Wikipedia – River Forth<\/a><\/li>\n<li id=\"s-f4\"><a href=\"https://www.nature.scot/plants-animals-and-fungi/fish/freshwater-fish/sparling\" target=\"_blank\" rel=\"noopener\">NatureScot – Sparling<\/a><\/li>\n<li id=\"s-f5\"><a href=\"https://sepa.gov.uk/media/155534/south_alloa-_monitoring_buoy_factsheet.pdf\" target=\"_blank\" rel=\"noopener\">SEPA – South Alloa monitoring buoy<\/a><\/li>\n<li id=\"s-f6\"><a href=\"https://archimer.ifremer.fr/doc/00100/21160\" target=\"_blank\" rel=\"noopener\">Comparison of the Forth and Tay estuaries (Archimer)<\/a><\/li>\n<li id=\"s-f7\"><a href=\"https://rsis.ramsar.org/ris/1111\" target=\"_blank\" rel=\"noopener\">Ramsar Sites Information Service – Firth of Forth<\/a><\/li>\n<li id=\"s-f8\"><a href=\"https://www.nature.scot/enjoying-outdoors/visit-our-nature-reserves/isle-may-national-nature-reserve\" target=\"_blank\" rel=\"noopener\">NatureScot – Isle of May NNR<\/a><\/li>\n<li id=\"s-f9\"><a href=\"https://forthriverstrust.org/rare-migratory-fish-of-the-firth-of-forth/\" target=\"_blank\" rel=\"noopener\">Forth Rivers Trust – Rare migratory fish of the Firth of Forth<\/a><\/li>\n<li id=\"s-f10\"><a href=\"https://unesco.org.uk/our-sites/world-heritage-sites/the-forth-bridge\" target=\"_blank\" rel=\"noopener\">UK National Commission for UNESCO – The Forth Bridge<\/a><\/li>\n<li id=\"s-f11\"><a href=\"https://www.forthports.co.uk/our-ports/leith-edinburgh/\" target=\"_blank\" rel=\"noopener\">Forth Ports – Leith<\/a><\/li>\n<li id=\"s-f12\"><a href=\"https://ice.org.uk/what-is-civil-engineering/infrastructure-projects/rosyth-dockyard\" target=\"_blank\" rel=\"noopener\">ICE – Rosyth Dockyard<\/a><\/li>\n<li id=\"s-f13\"><a href=\"https://www.hydrocarbonprocessing.com/news/2025/04/grangemouth-refinery-scotland-ceases-crude-oil-processing-transitions-into-import-terminal/\" target=\"_blank\" rel=\"noopener\">Hydrocarbon Processing – Grangemouth ceases crude processing<\/a><\/li>\n<\/ol><\/div>\n"}, "Tay": {"html": "<p class=\"kicker\">Tidal limit · just above Perth<\/p>\n<h2>The Tay: Britain's mightiest river<\/h2>\n<p class=\"lead\">No river in the UK carries more water. The Tay pours so much fresh water into its firth that salt barely gets past Newburgh, and it remains one of the great salmon rivers of the world.<\/p>\n<div class=\"facts\">\n<div><b>193 km<\/b><span>longest river in Scotland<sup><a href=\"#s-y1\">1<\/a><\/sup><\/span><\/div>\n<div><b>No. 1<\/b><span>greatest flow of any UK river<sup><a href=\"#s-y2\">2<\/a><\/sup><\/span><\/div>\n<div><b>2,268 m³/s<\/b><span>highest river flow ever recorded in the UK, 1993<sup><a href=\"#s-y3\">3<\/a><\/sup><\/span><\/div>\n<div><b>~48,000<\/b><span>wintering waterfowl on the Firth of Tay and Eden<sup><a href=\"#s-y4\">4<\/a><\/sup><\/span><\/div>\n<\/div>\n<h3>A river of rain and lochs<\/h3>\n<p>The Tay rises on Ben Lui and drains more than 5,000 km² of the Highlands, including Loch Tay, before passing Perth and Dundee to the North Sea.<sup><a href=\"#s-y1\">1<\/a><\/sup> Fed by some of Britain's wettest mountains, it carries the greatest flow of any river in the UK.<sup><a href=\"#s-y2\">2<\/a><\/sup> Spring tides reach about 4 km beyond Perth, but saline water occurs only as far upstream as Newburgh.<sup><a href=\"#s-y5\">5<\/a><\/sup> For several miles below Perth the tidal river is essentially fresh, and only after the River Earn joins does the firth become steadily saltier.<sup><a href=\"#s-y6\">6<\/a><\/sup> Studies show that salinity in the Tay depends far more on river flow than on the size of the tide.<sup><a href=\"#s-y7\">7<\/a><\/sup><\/p>\n<h3>Salmon, reeds and dolphins<\/h3>\n<p>The River Tay is a Special Area of Conservation, chosen above all for its Atlantic salmon; it also protects sea, river and brook lamprey and otter.<sup><a href=\"#s-y2\">2<\/a><\/sup> In 1922 Georgina Ballantine landed a 64 lb salmon on the Tay, still the British rod-caught record.<sup><a href=\"#s-y8\">8<\/a><\/sup> The Tay, the Forth and the Cree are the last Scottish rivers with sparling.<sup><a href=\"#s-y9\">9<\/a><\/sup><\/p>\n<p>Along the north shore of the inner firth runs a reedbed about 15 km long, thought to be the largest continuous stand of reed in Britain, where bearded tits, marsh harriers and water rails breed.<sup><a href=\"#s-y10\">10<\/a><\/sup> The Firth of Tay and Eden Estuary is a Ramsar site and Special Protection Area holding around 48,000 wintering waterfowl.<sup><a href=\"#s-y4\">4<\/a><\/sup> At the mouth, bottlenose dolphins hunt in the Tay and St Andrews Bay, about half of Scotland's east-coast population.<sup><a href=\"#s-y11\">11<\/a><\/sup> The estuary's harbour seals, however, are in a steep decline whose cause is still unknown.<sup><a href=\"#s-y12\">12<\/a><\/sup><\/p>\n<h3>People and the river<\/h3>\n<p>Perth and Dundee grew on the Tay, and its power has shaped both. On 28 December 1879 the first Tay Bridge collapsed in a violent gale, taking a train and up to 75 people with it; its designer had made no explicit allowance for wind.<sup><a href=\"#s-y13\">13<\/a><\/sup> In January 1993 snowmelt and heavy rain produced the largest river flow ever measured in the UK; in Perth the river rose more than 6 m and over 1,500 people left their homes. Flood defences costing about £25 million were completed in 2001.<sup><a href=\"#s-y3\">3<\/a>,<a href=\"#s-y14\">14<\/a><\/sup><\/p>\n<h3>Pressures<\/h3>\n<p>SEPA lists sewage, regulated flows from hydro schemes and invasive species such as Japanese knotweed, giant hogweed and American mink among the pressures on the catchment.<sup><a href=\"#s-y1\">1<\/a>,<a href=\"#s-y15\">15<\/a><\/sup> A warming climate and wetter winters may make floods like 1993 more likely, while warmer summers stress the cold-water fish the river is famous for.<\/p>\n<div class=\"src\"><b>Sources<\/b><ol>\n<li id=\"s-y1\"><a href=\"https://www.sepa.org.uk/media/76597/doc-14-tay_catchment_profile.pdf\" target=\"_blank\" rel=\"noopener\">SEPA – Tay catchment profile<\/a><\/li>\n<li id=\"s-y2\"><a href=\"https://sac.jncc.gov.uk/site/UK0030312\" target=\"_blank\" rel=\"noopener\">JNCC – River Tay SAC<\/a><\/li>\n<li id=\"s-y3\"><a href=\"https://sites.dundee.ac.uk/hydrology/remembering-the-great-tay-flood-of-january-1993/\" target=\"_blank\" rel=\"noopener\">University of Dundee – The great Tay flood of 1993<\/a><\/li>\n<li id=\"s-y4\"><a href=\"https://rsis.ramsar.org/ris/1034\" target=\"_blank\" rel=\"noopener\">Ramsar Sites Information Service – Firth of Tay and Eden Estuary<\/a><\/li>\n<li id=\"s-y5\"><a href=\"https://www.taysidebiodiversity.co.uk/wp-content/uploads/2015/01/Section2Coast1.pdf\" target=\"_blank\" rel=\"noopener\">Tayside Biodiversity Partnership – Coast<\/a><\/li>\n<li id=\"s-y6\"><a href=\"https://newburghsailingclub.org/aboutthetay.html\" target=\"_blank\" rel=\"noopener\">Tay District Salmon Fisheries Board, via Newburgh Sailing Club<\/a><\/li>\n<li id=\"s-y7\"><a href=\"https://www.cambridge.org/core/journals/proceedings-of-the-royal-society-of-edinburgh-section-b-biological-sciences/article/salinity-distribution-in-the-tay-estuary/B2D12B0621929F32E4C9820E91448EEE\" target=\"_blank\" rel=\"noopener\">Williams &amp; West – Salinity distribution in the Tay Estuary<\/a><\/li>\n<li id=\"s-y8\"><a href=\"https://en.wikipedia.org/wiki/River_Tay\" target=\"_blank\" rel=\"noopener\">Wikipedia – River Tay<\/a><\/li>\n<li id=\"s-y9\"><a href=\"https://www.nature.scot/plants-animals-and-fungi/fish/freshwater-fish/sparling\" target=\"_blank\" rel=\"noopener\">NatureScot – Sparling<\/a><\/li>\n<li id=\"s-y10\"><a href=\"https://www.nature.scot/sites/default/files/site-special-scientific-interest/809/sssi-citation.pdf\" target=\"_blank\" rel=\"noopener\">NatureScot – Inner Tay Estuary SSSI citation<\/a><\/li>\n<li id=\"s-y11\"><a href=\"https://tethys.pnnl.gov/publications/changing-distribution-east-coast-scotland-bottlenose-dolphin-population-challenges\" target=\"_blank\" rel=\"noopener\">Arso Civil et al. – East-coast bottlenose dolphins<\/a><\/li>\n<li id=\"s-y12\"><a href=\"https://discovery.dundee.ac.uk/en/publications/harbour-seal-phoca-vitulina-abundance-within-the-firth-of-tay-and/\" target=\"_blank\" rel=\"noopener\">University of Dundee – Harbour seals in the Firth of Tay<\/a><\/li>\n<li id=\"s-y13\"><a href=\"https://en.wikipedia.org/wiki/Tay_Bridge_disaster\" target=\"_blank\" rel=\"noopener\">Wikipedia – Tay Bridge disaster<\/a><\/li>\n<li id=\"s-y14\"><a href=\"https://en.wikipedia.org/wiki/1993_Perth_flood\" target=\"_blank\" rel=\"noopener\">Wikipedia – 1993 Perth flood<\/a><\/li>\n<li id=\"s-y15\"><a href=\"https://www.invasivespecies.scot/node/91\" target=\"_blank\" rel=\"noopener\">Scotland's Invasive Species Initiative – Tay<\/a><\/li>\n<\/ol><\/div>\n"}};
const storyEl=document.getElementById('story'),storyBody=document.getElementById('storybody');
const wide=()=>window.innerWidth>700;
let current='all';
function fit(k){const ph=document.getElementById('panel').offsetHeight;const pad=wide()?(!storyEl.classList.contains('hidden')?{paddingTopLeft:[430,30],paddingBottomRight:[270,30]}:{paddingTopLeft:[30,30],paddingBottomRight:[270,30]}):{paddingTopLeft:[20,20],paddingBottomRight:[20,ph+30]};
  map.fitBounds((k==='all'?all:groups[k]).getBounds(),pad);}
function renderStory(k){const st=STORIES[k];if(!st)return;
  document.getElementById('storycrumb').textContent=k==='all'?'UK tidal rivers · overview':'UK tidal rivers · '+k;
  storyBody.innerHTML=st.html;storyBody.scrollTop=0;
  storyBody.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',ev=>{ev.preventDefault();select(a.dataset.go,true);}));}
function select(k,fromStory){current=k;
  document.querySelectorAll('#btns button').forEach(b=>b.classList.toggle('on',b.dataset.r===k));
  renderStory(k);
  fit(k);}
document.getElementById('btns').addEventListener('click',e=>{const k=e.target.dataset.r;if(!k)return;select(k);});
document.getElementById('readbtn').addEventListener('click',()=>{renderStory(current);storyEl.classList.remove('hidden');if(wide())fit(current);});
document.getElementById('storyclose').addEventListener('click',()=>{storyEl.classList.add('hidden');});
renderStory('all');
if(wide()){storyEl.classList.remove('hidden');}else{document.getElementById('panel').classList.add('closed');}
fit('all');
document.getElementById('tg').addEventListener('click',()=>{
  const p=document.getElementById('panel');p.classList.toggle('closed');
  document.getElementById('tg').textContent=p.classList.contains('closed')?'legend':'hide legend';
});
</script>
</body>
