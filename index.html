// Zone van een willekeurig punt: projecteer op de dichtstbijzijnde ijklijn-sectie
function zoneOf(r,lon,lat){
  let best=1e9,zone='n';
  r.L.forEach(line=>{
    for(let i=0;i<line.length-1;i++){
      const ax=line[i][0]*r.k,ay=line[i][1],bx=line[i+1][0]*r.k,by=line[i+1][1],px=lon*r.k,py=lat;
      const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;t=Math.max(0,Math.min(1,t));
      const d=(ax+t*dx-px)**2+(ay+t*dy-py)**2;
      if(d<best){best=d;zone=line[i][2];}
    }
  });
  return zone;
}

const SRC={Thames:['Thames'],Severn:['Severn'],Mersey:['Mersey'],Humber:['Ouse','Trent'],Tyne:['Tyne'],Clyde:['Clyde'],Forth:['Forth'],Tay:['Tay']};
const LINES={};DATA.split('|').forEach(part=>{const i=part.indexOf(':');const k=part.slice(0,i);
  LINES[k]=part.slice(i+1).split(';').map(s=>{const v=s.split(',').map(Number);const out=[];let x=v[0],y=v[1];out.push([x/1e4,y/1e4]);for(let j=2;j<v.length;j+=2){x+=v[j];y+=v[j+1];out.push([x/1e4,y/1e4]);}return out;});});

function drawLine(r,pts){
  let run=[],cur=null;
  const flush=()=>{ if(run.length>1){const c=C[cur];L.polyline(run,{color:c[0],weight:c[1],opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(r.lines);} };
  pts.forEach(p=>{
    const z=zoneOf(r,p[0],p[1]);
    if(z!==cur){ if(run.length){run.push([p[1],p[0]]);flush();} run=[[p[1],p[0]]];cur=z; }
    else run.push([p[1],p[0]]);
  });
  flush();
}

R.forEach(r=>{
  const pts=[];SRC[r.t].forEach(k=>(LINES[k]||[]).forEach(l=>{drawLine(r,l);pts.push(...l)}));
  const dist=q=>{let m=1e9;for(const p of pts){const d=Math.hypot((p[0]-q[0])*r.k,p[1]-q[1]);if(d<m)m=d;}return m;};
  // estuarium voorbij het einde van de rivierlijn: schematisch (gestippeld)
  r.L.forEach(line=>{let last=-1;line.forEach((q,i)=>{if(dist(q)<0.02)last=i;});
    for(let i=Math.max(last,0);i<line.length-1;i++){const a=line[i],b=line[i+1],c=C[a[2]];
      L.polyline([[a[1],a[0]],[b[1],b[0]]],{color:c[0],weight:c[1],opacity:.85,dashArray:'6 8',lineCap:'round'}).addTo(r.lines);}
  });
  // uitlegpunten op de echte rivier leggen (binnen ~3 km)
  r.markers.forEach(m=>{const q=m.q;let best=null,bd=0.035;for(const p of pts){const d=Math.hypot((p[0]-q[0])*r.k,p[1]-q[1]);if(d<bd){bd=d;best=p;}}if(best)m.mk.setLatLng([best[1],best[0]]);});
});
map.fitBounds(all.getBounds(),{padding:[20,20]});
status.textContent='Rivierlopen van bron tot monding (OpenStreetMap, vereenvoudigd tot ~100 m). Gestippeld = schematisch estuarium.';
status.style.color='#3B6D11';

document.getElementById('btns').addEventListener('click',e=>{
  const k=e.target.dataset.r;if(!k)return;
  map.fitBounds((k==='all'?all:groups[k]).getBounds(),{padding:[30,30]});
});
document.getElementById('tg').addEventListener('click',()=>{
  const p=document.getElementById('panel');p.classList.toggle('closed');
  document.getElementById('tg').textContent=p.classList.contains('closed')?'toon':'verberg';
});
